name: trustline

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustline
      POSTGRES_PASSWORD: trustline
      POSTGRES_DB: trustline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustline -d trustline"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"   # host 6380 so a locally running redis on 6379 does not clash
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI + JSON API
      - "1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  minio:
    # MinIO stopped publishing to Docker Hub/quay in 2025; the Bitnami legacy build is the
    # same server and is still pullable. See DECISIONS.md.
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: trustline
      MINIO_ROOT_PASSWORD: trustline123
      MINIO_DEFAULT_BUCKETS: trustline-evidence
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["serve"]
    env_file: .env.docker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["worker"]
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
  miniodata:
