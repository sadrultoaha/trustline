# Trustline control catalog. Controls are framework-neutral; frameworks map
# their requirements onto these codes (see frameworks/*.yaml) — that mapping is
# the crosswalk. `evidence`: automated = satisfied by tests, manual = needs
# uploaded evidence, hybrid = tests where connected, otherwise evidence.
# `keywords` help evidence validation decide whether a document is relevant.

- code: GOV-01
  name: Information security program
  domain: Governance
  description: A documented information security program, including an approved information security policy, is maintained and communicated to personnel.
  evidence: manual
  evidence_hint: Approved information security policy with version history and approver.
  keywords: [information security policy, security program, isms]
  evidence_ttl_days: 365
