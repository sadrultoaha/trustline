id: iso27001
name: ISO/IEC 27001
version: "2022 (Annex A)"
publisher: ISO/IEC
description: >-
  The international standard for information security management systems. This
  file covers the 93 Annex A reference controls of the 2022 edition, grouped
  into organizational, people, physical and technological themes. Titles and
  descriptions are paraphrased summaries, not the standard's text.
sections:
  - A.5 Organizational controls
  - A.6 People controls
  - A.7 Physical controls
  - A.8 Technological controls
requirements:
  # A.5 Organizational controls
  - code: A.5.1
    section: A.5 Organizational controls
    title: Policies for information security
    description: An information security policy and supporting topic-specific policies are defined, approved by management, published, acknowledged and reviewed periodically.
    controls: [GOV-01, GOV-04, GOV-05]
  - code: A.5.2
    section: A.5 Organizational controls
    title: Information security roles and responsibilities
    description: Security roles and responsibilities are defined and assigned according to the organization's needs.
    controls: [GOV-02]
  - code: A.5.3
    section: A.5 Organizational controls
    title: Segregation of duties
    description: Conflicting duties and areas of responsibility are separated to reduce the chance of misuse or error.
    controls: [IAM-05, CHG-01, CHG-02]
  - code: A.5.4
    section: A.5 Organizational controls
    title: Management responsibilities
    description: Management requires all personnel to apply security in line with the established policies and procedures.
    controls: [GOV-03, GOV-05]
  - code: A.5.5
    section: A.5 Organizational controls
    title: Contact with authorities
    description: The organization establishes and keeps contact with relevant authorities such as regulators and law enforcement.
    controls: [IR-03, GOV-08]
  - code: A.5.6
    section: A.5 Organizational controls
    title: Contact with special interest groups
    description: Contact is maintained with security forums, professional associations and similar groups to stay informed.
    controls: [GOV-02]
  - code: A.5.7
    section: A.5 Organizational controls
    title: Threat intelligence
    description: Information about security threats is collected and analyzed to produce useful threat intelligence.
    controls: [LOG-05, VUL-01]
  - code: A.5.8
    section: A.5 Organizational controls
    title: Information security in project management
    description: Security is built into project management activities from the start.
    controls: [DEV-01, RSK-01]
  - code: A.5.9
    section: A.5 Organizational controls
    title: Inventory of information and other associated assets
    description: An inventory of information and associated assets, with designated owners, is developed and maintained.
    controls: [AST-01, AI-01]
  - code: A.5.10
    section: A.5 Organizational controls
    title: Acceptable use of information and assets
    description: Rules for acceptable use and handling of information and associated assets are identified, documented and implemented.
    controls: [GOV-05, AI-03]
  - code: A.5.11
    section: A.5 Organizational controls
    title: Return of assets
    description: Personnel and other parties return organizational assets they hold when their employment, contract or agreement changes or ends.
    controls: [HR-05, AST-01]
  - code: A.5.12
    section: A.5 Organizational controls
    title: Classification of information
    description: Information is classified according to the organization's security needs, based on confidentiality, integrity, availability and stakeholder requirements.
    controls: [AST-02]
  - code: A.5.13
    section: A.5 Organizational controls
    title: Labelling of information
    description: Procedures for labelling information are developed and applied in line with the classification scheme.
    controls: [AST-02]
  - code: A.5.14
    section: A.5 Organizational controls
    title: Information transfer
    description: Rules, procedures or agreements govern transfer of information within the organization and with other parties, for all transfer methods.
    controls: [CRY-02, VEN-03, HR-03]
  - code: A.5.15
    section: A.5 Organizational controls
    title: Access control
    description: Rules for physical and logical access to information and assets are established based on business and security requirements.
    controls: [IAM-03, IAM-05, IAM-12, NET-01, DAT-01]
  - code: A.5.16
    section: A.5 Organizational controls
    title: Identity management
    description: The full lifecycle of identities is managed, with each identity uniquely attributable.
    controls: [IAM-02, IAM-07, IAM-10]
  - code: A.5.17
    section: A.5 Organizational controls
    title: Authentication information
    description: Allocation and management of authentication information such as passwords and keys is controlled, including advising users on proper handling.
    controls: [IAM-01, IAM-06, IAM-08, IAM-09, VUL-05]
  - code: A.5.18
    section: A.5 Organizational controls
    title: Access rights
    description: Access rights are provisioned, reviewed, adjusted and removed according to the access control policy.
    controls: [IAM-03, IAM-04, IAM-07, HR-05]
  - code: A.5.19
    section: A.5 Organizational controls
    title: Information security in supplier relationships
    description: Processes are defined to manage security risks from the use of supplier products and services.
    controls: [VEN-01, VEN-02]
  - code: A.5.20
    section: A.5 Organizational controls
    title: Addressing security within supplier agreements
    description: Relevant security requirements are agreed with each supplier according to the type of relationship.
    controls: [VEN-03]
  - code: A.5.21
    section: A.5 Organizational controls
    title: Managing security in the ICT supply chain
    description: Processes are defined to manage security risks associated with the ICT product and service supply chain.
    controls: [VEN-02, VEN-04, VUL-01]
  - code: A.5.22
    section: A.5 Organizational controls
    title: Monitoring, review and change management of supplier services
    description: Supplier security practices and service delivery are regularly monitored, reviewed, evaluated and changes managed.
    controls: [VEN-02, VEN-01]
  - code: A.5.23
    section: A.5 Organizational controls
    title: Information security for use of cloud services
    description: Acquisition, use, management and exit from cloud services follow defined security requirements.
    controls: [VEN-02, VEN-03, IAM-12, PHY-01]
  - code: A.5.24
    section: A.5 Organizational controls
    title: Incident management planning and preparation
    description: The organization plans for incident management by defining processes, roles and responsibilities.
    controls: [IR-01, IR-02]
  - code: A.5.25
    section: A.5 Organizational controls
    title: Assessment and decision on security events
    description: Security events are assessed to decide whether they should be categorized as incidents.
    controls: [LOG-06, IR-04]
  - code: A.5.26
    section: A.5 Organizational controls
    title: Response to information security incidents
    description: Incidents are responded to according to documented procedures.
    controls: [IR-01, IR-03, IR-04, AI-08]
  - code: A.5.27
    section: A.5 Organizational controls
    title: Learning from information security incidents
    description: Knowledge gained from incidents is used to strengthen and improve security controls.
    controls: [IR-04, GOV-03]
  - code: A.5.28
    section: A.5 Organizational controls
    title: Collection of evidence
    description: Procedures are in place to identify, collect, acquire and preserve evidence related to security events.
    controls: [LOG-02, LOG-03, IR-04]
  - code: A.5.29
    section: A.5 Organizational controls
    title: Information security during disruption
    description: The organization plans how to maintain security at an appropriate level during a disruption.
    controls: [BCP-01]
  - code: A.5.30
    section: A.5 Organizational controls
    title: ICT readiness for business continuity
    description: ICT readiness is planned, implemented, maintained and tested based on continuity objectives and requirements.
    controls: [BCP-01, BCP-02, BCP-03, RSK-04, DAT-04]
  - code: A.5.31
    section: A.5 Organizational controls
    title: Legal, statutory, regulatory and contractual requirements
    description: Relevant legal, regulatory and contractual security requirements and the organization's approach to meeting them are identified, documented and kept current.
    controls: [GOV-08]
  - code: A.5.32
    section: A.5 Organizational controls
    title: Intellectual property rights
    description: Appropriate procedures protect intellectual property rights, including licensing obligations.
    controls: [GOV-08, DEV-03]
  - code: A.5.33
    section: A.5 Organizational controls
    title: Protection of records
    description: Records are protected from loss, destruction, falsification, unauthorized access and unauthorized release.
    controls: [DAT-02, DAT-03, DAT-05, LOG-02, HR-07]
  - code: A.5.34
    section: A.5 Organizational controls
    title: Privacy and protection of PII
    description: Requirements for preserving privacy and protecting personal data under applicable laws and contracts are identified and met.
    controls: [DAT-06, DAT-07, DAT-08, GOV-08]
  - code: A.5.35
    section: A.5 Organizational controls
    title: Independent review of information security
    description: The organization's approach to managing security is independently reviewed at planned intervals or after significant changes.
    controls: [GOV-03, VUL-03]
  - code: A.5.36
    section: A.5 Organizational controls
    title: Compliance with policies, rules and standards
    description: Compliance with the security policy, topic-specific policies, rules and standards is regularly reviewed.
    controls: [GOV-03, GOV-04, IAM-04]
  - code: A.5.37
    section: A.5 Organizational controls
    title: Documented operating procedures
    description: Operating procedures for information processing facilities are documented and made available to those who need them.
    controls: [GOV-01, CHG-05, IR-01]
  # A.6 People controls
  - code: A.6.1
    section: A.6 People controls
    title: Screening
    description: Background verification checks on candidates are carried out before joining, proportionate to business needs, the information accessed and perceived risks, and in line with law.
    controls: [HR-01]
  - code: A.6.2
    section: A.6 People controls
    title: Terms and conditions of employment
    description: Employment agreements state the personnel's and the organization's responsibilities for information security.
    controls: [HR-03, GOV-06, HR-07]
  - code: A.6.3
    section: A.6 People controls
    title: Security awareness, education and training
    description: Personnel receive appropriate, regularly updated security awareness, education and training relevant to their role.
    controls: [HR-02, HR-04]
  - code: A.6.4
    section: A.6 People controls
    title: Disciplinary process
    description: A formal, communicated disciplinary process exists for personnel who violate the security policy.
    controls: [HR-06]
  - code: A.6.5
    section: A.6 People controls
    title: Responsibilities after termination or change of employment
    description: Security responsibilities that remain valid after termination or change of employment are defined, communicated and enforced, and access is adjusted.
    controls: [HR-05, HR-03]
  - code: A.6.6
    section: A.6 People controls
    title: Confidentiality or non-disclosure agreements
    description: Confidentiality agreements reflecting the organization's protection needs are identified, documented, reviewed and signed by personnel and relevant parties.
    controls: [HR-03, VEN-03]
  - code: A.6.7
    section: A.6 People controls
    title: Remote working
    description: Security measures protect information accessed, processed or stored outside the organization's premises by remote workers.
    controls: [IAM-01, AST-03, AST-04, AST-05, CRY-02]
  - code: A.6.8
    section: A.6 People controls
    title: Information security event reporting
    description: Personnel have a mechanism to report observed or suspected security events promptly through appropriate channels.
    controls: [IR-01, IR-04, HR-02]
  # A.7 Physical controls
  - code: A.7.1
    section: A.7 Physical controls
    title: Physical security perimeters
    description: Security perimeters are defined and used to protect areas containing information and associated assets.
    controls: [PHY-01]
  - code: A.7.2
    section: A.7 Physical controls
    title: Physical entry
    description: Secure areas are protected by appropriate entry controls and access points.
    controls: [PHY-01]
  - code: A.7.3
    section: A.7 Physical controls
    title: Securing offices, rooms and facilities
    description: Physical security for offices, rooms and facilities is designed and implemented.
    controls: [PHY-01]
  - code: A.7.4
    section: A.7 Physical controls
    title: Physical security monitoring
    description: Premises are continuously monitored for unauthorized physical access.
    controls: [PHY-01]
  - code: A.7.5
    section: A.7 Physical controls
    title: Protecting against physical and environmental threats
    description: Protection against physical and environmental threats such as natural disasters and other intentional or unintentional threats is designed and implemented.
    controls: [PHY-01, BCP-03]
  - code: A.7.6
    section: A.7 Physical controls
    title: Working in secure areas
    description: Security measures for working in secure areas are designed and implemented.
    controls: [PHY-01]
  - code: A.7.7
    section: A.7 Physical controls
    title: Clear desk and clear screen
    description: Clear desk rules for papers and removable media and clear screen rules for processing facilities are defined and enforced.
    controls: [AST-04, PHY-01]
  - code: A.7.8
    section: A.7 Physical controls
    title: Equipment siting and protection
    description: Equipment is sited securely and protected.
    controls: [PHY-01]
  - code: A.7.9
    section: A.7 Physical controls
    title: Security of assets off-premises
    description: Assets used outside the organization's premises are protected.
    controls: [AST-03, AST-04, AST-05]
  - code: A.7.10
    section: A.7 Physical controls
    title: Storage media
    description: Storage media are managed through their lifecycle of acquisition, use, transport and disposal according to the classification scheme and handling requirements.
    controls: [AST-06, AST-03, CRY-01]
  - code: A.7.11
    section: A.7 Physical controls
    title: Supporting utilities
    description: Information processing facilities are protected from power failures and other disruptions caused by failures in supporting utilities.
    controls: [PHY-01]
  - code: A.7.12
    section: A.7 Physical controls
    title: Cabling security
    description: Cables carrying power, data or supporting services are protected from interception, interference or damage.
    controls: [PHY-01]
  - code: A.7.13
    section: A.7 Physical controls
    title: Equipment maintenance
    description: Equipment is maintained correctly to ensure the availability, integrity and confidentiality of information.
    controls: [PHY-01, VUL-04]
  - code: A.7.14
    section: A.7 Physical controls
    title: Secure disposal or re-use of equipment
    description: Equipment with storage media is checked so that sensitive data and licensed software are removed or securely overwritten before disposal or re-use.
    controls: [AST-06]
  # A.8 Technological controls
  - code: A.8.1
    section: A.8 Technological controls
    title: User endpoint devices
    description: Information stored on, processed by or accessible through user endpoint devices is protected.
    controls: [AST-03, AST-04, AST-05, AST-01]
  - code: A.8.2
    section: A.8 Technological controls
    title: Privileged access rights
    description: Allocation and use of privileged access rights is restricted and managed.
    controls: [IAM-05, IAM-08, IAM-12]
  - code: A.8.3
    section: A.8 Technological controls
    title: Information access restriction
    description: Access to information and associated assets is restricted in line with the access control policy.
    controls: [IAM-03, IAM-12, DAT-01, NET-02]
  - code: A.8.4
    section: A.8 Technological controls
    title: Access to source code
    description: Read and write access to source code, development tools and software libraries is appropriately managed.
    controls: [DEV-03, CHG-02, DEV-02]
  - code: A.8.5
    section: A.8 Technological controls
    title: Secure authentication
    description: Secure authentication technologies and procedures are implemented based on access restrictions and the access control policy.
    controls: [IAM-01, IAM-06, IAM-10, IAM-11]
  - code: A.8.6
    section: A.8 Technological controls
    title: Capacity management
    description: Use of resources is monitored and adjusted in line with current and expected capacity requirements.
    controls: [BCP-03, LOG-01]
  - code: A.8.7
    section: A.8 Technological controls
    title: Protection against malware
    description: Protection against malware is implemented and supported by appropriate user awareness.
    controls: [AST-05, HR-02]
  - code: A.8.8
    section: A.8 Technological controls
    title: Management of technical vulnerabilities
    description: Information about technical vulnerabilities is obtained, exposure is evaluated and appropriate measures are taken.
    controls: [VUL-01, VUL-02, VUL-03, VUL-04, PAY-02]
  - code: A.8.9
    section: A.8 Technological controls
    title: Configuration management
    description: Security configurations of hardware, software, services and networks are established, documented, implemented, monitored and reviewed.
    controls: [CHG-05, NET-04, LOG-05, IAM-12]
  - code: A.8.10
    section: A.8 Technological controls
    title: Information deletion
    description: Information in systems, devices or other storage media is deleted when no longer required.
    controls: [DAT-02, AST-06]
  - code: A.8.11
    section: A.8 Technological controls
    title: Data masking
    description: Data masking is used according to the access control policy, related policies and business requirements, considering applicable law.
    controls: [AST-02, DAT-08, CHG-04]
  - code: A.8.12
    section: A.8 Technological controls
    title: Data leakage prevention
    description: Data leakage prevention measures are applied to systems, networks and devices that process, store or transmit sensitive information.
    controls: [DAT-01, VUL-05, NET-02, LOG-04]
  - code: A.8.13
    section: A.8 Technological controls
    title: Information backup
    description: Backup copies of information, software and systems are maintained and regularly tested according to a backup policy.
    controls: [DAT-03, DAT-04, DAT-05]
  - code: A.8.14
    section: A.8 Technological controls
    title: Redundancy of information processing facilities
    description: Information processing facilities are implemented with enough redundancy to meet availability requirements.
    controls: [BCP-03, BCP-01]
  - code: A.8.15
    section: A.8 Technological controls
    title: Logging
    description: Logs recording activities, exceptions, faults and other relevant events are produced, stored, protected and analyzed.
    controls: [LOG-01, LOG-02, LOG-03, LOG-04]
  - code: A.8.16
    section: A.8 Technological controls
    title: Monitoring activities
    description: Networks, systems and applications are monitored for anomalous behavior and appropriate action is taken to evaluate potential incidents.
    controls: [LOG-05, LOG-06, AI-04]
  - code: A.8.17
    section: A.8 Technological controls
    title: Clock synchronization
    description: Clocks of information processing systems are synchronized to approved time sources.
    controls: [LOG-01]
  - code: A.8.18
    section: A.8 Technological controls
    title: Use of privileged utility programs
    description: Use of utility programs that can override system and application controls is restricted and tightly controlled.
    controls: [IAM-05, IAM-12]
  - code: A.8.19
    section: A.8 Technological controls
    title: Installation of software on operational systems
    description: Procedures and measures securely manage software installation on operational systems.
    controls: [CHG-05, CHG-03, VUL-04]
  - code: A.8.20
    section: A.8 Technological controls
    title: Networks security
    description: Networks and network devices are secured, managed and controlled to protect information in systems and applications.
    controls: [NET-01, NET-02, NET-03, NET-04]
  - code: A.8.21
    section: A.8 Technological controls
    title: Security of network services
    description: Security mechanisms, service levels and requirements for network services are identified, implemented and monitored.
    controls: [NET-01, CRY-02, VEN-03]
  - code: A.8.22
    section: A.8 Technological controls
    title: Segregation of networks
    description: Groups of information services, users and systems are segregated in the organization's networks.
    controls: [NET-03, CHG-04]
  - code: A.8.23
    section: A.8 Technological controls
    title: Web filtering
    description: Access to external websites is managed to reduce exposure to malicious content.
    controls: [AST-05, NET-03]
  - code: A.8.24
    section: A.8 Technological controls
    title: Use of cryptography
    description: Rules for effective use of cryptography, including cryptographic key management, are defined and implemented.
    controls: [CRY-01, CRY-02, CRY-03, AST-03, IAM-09]
  - code: A.8.25
    section: A.8 Technological controls
    title: Secure development life cycle
    description: Rules for the secure development of software and systems are established and applied.
    controls: [DEV-01, VUL-06, CHG-03]
  - code: A.8.26
    section: A.8 Technological controls
    title: Application security requirements
    description: Security requirements are identified, specified and approved when developing or acquiring applications.
    controls: [DEV-01, VEN-02]
  - code: A.8.27
    section: A.8 Technological controls
    title: Secure system architecture and engineering principles
    description: Principles for engineering secure systems are established, documented, maintained and applied to development activities.
    controls: [DEV-01, NET-03, IAM-12]
  - code: A.8.28
    section: A.8 Technological controls
    title: Secure coding
    description: Secure coding principles are applied to software development.
    controls: [DEV-01, VUL-05, VUL-06, CHG-01]
  - code: A.8.29
    section: A.8 Technological controls
    title: Security testing in development and acceptance
    description: Security testing processes are defined and carried out within the development life cycle.
    controls: [CHG-03, VUL-01, VUL-06, VUL-03]
  - code: A.8.30
    section: A.8 Technological controls
    title: Outsourced development
    description: The organization directs, monitors and reviews activities related to outsourced system development.
    controls: [VEN-02, VEN-03, CHG-01]
  - code: A.8.31
    section: A.8 Technological controls
    title: Separation of development, test and production environments
    description: Development, testing and production environments are kept separate and secured.
    controls: [CHG-04]
  - code: A.8.32
    section: A.8 Technological controls
    title: Change management
    description: Changes to information processing facilities and systems follow change management procedures.
    controls: [CHG-05, CHG-01, CHG-02, CHG-03, CHG-06]
  - code: A.8.33
    section: A.8 Technological controls
    title: Test information
    description: Test information is appropriately selected, protected and managed.
    controls: [CHG-04, AST-02]
  - code: A.8.34
    section: A.8 Technological controls
    title: Protection of information systems during audit testing
    description: Audit tests and other assurance activities involving operational systems are planned and agreed between the tester and appropriate management.
    controls: [VUL-03, GOV-03]
