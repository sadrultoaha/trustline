id: iso42001
name: ISO/IEC 42001
version: "2023"
publisher: ISO/IEC
description: ISO/IEC 42001 specifies requirements for establishing, implementing, maintaining and continually improving an AI management system. Its Annex A lists reference controls covering AI policy, internal organization, resources, impact assessment, the AI system life cycle, data, information for interested parties, responsible use and third-party relationships.
sections:
  - A.2 Policies related to AI
  - A.3 Internal organization
  - A.4 Resources for AI systems
  - A.5 Assessing impacts of AI systems
  - A.6 AI system life cycle
  - A.7 Data for AI systems
  - A.8 Information for interested parties of AI systems
  - A.9 Use of AI systems
  - A.10 Third-party and customer relationships
requirements:
  - code: A.2.2
    section: A.2 Policies related to AI
    title: AI policy
    description: The organization documents a policy for the development or use of AI systems.
    controls: [AI-03]
  - code: A.2.3
    section: A.2 Policies related to AI
    title: Alignment with other organizational policies
    description: The organization determines where other policies, such as security, privacy or quality, are affected by or apply to its AI objectives.
    controls: [AI-03, GOV-01]
  - code: A.2.4
    section: A.2 Policies related to AI
    title: Review of the AI policy
    description: The AI policy is reviewed at planned intervals, or when needed, to keep it suitable, adequate and effective.
    controls: [GOV-04, AI-03]
  - code: A.3.2
    section: A.3 Internal organization
    title: AI roles and responsibilities
    description: Roles and responsibilities for AI are defined and allocated according to the needs of the organization.
    controls: [GOV-02, GOV-07]
  - code: A.3.3
    section: A.3 Internal organization
    title: Reporting of concerns
    description: A process lets people in the organization raise concerns about its role with respect to an AI system throughout the system's life cycle.
    controls: [AI-08, GOV-06]
  - code: A.4.2
    section: A.4 Resources for AI systems
    title: Resource documentation
    description: Resources needed for each AI system life cycle stage and other AI-related activities are identified and documented.
    controls: [AI-01, AST-01]
  - code: A.4.3
    section: A.4 Resources for AI systems
    title: Data resources
    description: Information about the data resources used by the AI system is documented.
    controls: [AI-06, AST-02]
  - code: A.4.4
    section: A.4 Resources for AI systems
    title: Tooling resources
    description: Information about the tools used for the AI system, such as development frameworks and libraries, is documented.
    controls: [AI-01, AST-01]
  - code: A.4.5
    section: A.4 Resources for AI systems
    title: System and computing resources
    description: Information about the system and computing resources used by the AI system is documented.
    controls: [AI-01, AST-01]
  - code: A.4.6
    section: A.4 Resources for AI systems
    title: Human resources
    description: The people and competencies needed across the AI system life cycle are identified and documented.
    controls: [GOV-02, HR-02]
  - code: A.5.2
    section: A.5 Assessing impacts of AI systems
    title: AI system impact assessment process
    description: A process is established to assess potential consequences of the AI system for individuals, groups and society across its life cycle.
    controls: [AI-02, DAT-08]
  - code: A.5.3
    section: A.5 Assessing impacts of AI systems
    title: Documentation of AI system impact assessments
    description: Results of AI system impact assessments are documented and retained for a defined period.
    controls: [AI-02, DAT-08]
  - code: A.5.4
    section: A.5 Assessing impacts of AI systems
    title: Assessing impact on individuals or groups
    description: Potential impacts of the AI system on individuals or groups of individuals are assessed and documented throughout the life cycle.
    controls: [AI-02, DAT-08]
  - code: A.5.5
    section: A.5 Assessing impacts of AI systems
    title: Assessing societal impacts
    description: Potential societal impacts of the AI system are assessed and documented throughout the life cycle.
    controls: [AI-02]
  - code: A.6.1.2
    section: A.6 AI system life cycle
    title: Objectives for responsible development
    description: Objectives guiding responsible development of AI systems are identified, documented and integrated into the development life cycle.
    controls: [AI-03, DEV-01]
  - code: A.6.1.3
    section: A.6 AI system life cycle
    title: Processes for responsible design and development
    description: Processes for the responsible design and development of AI systems are defined and documented.
    controls: [DEV-01, AI-03, CHG-05]
  - code: A.6.2.2
    section: A.6 AI system life cycle
    title: AI system requirements and specification
    description: Requirements for new AI systems or material changes to existing ones are specified and documented.
    controls: [DEV-01, CHG-05]
  - code: A.6.2.3
    section: A.6 AI system life cycle
    title: Documentation of AI system design and development
    description: The design and development of the AI system is documented according to organizational objectives and specified requirements.
    controls: [AI-07, DEV-01]
  - code: A.6.2.4
    section: A.6 AI system life cycle
    title: AI system verification and validation
    description: Verification and validation measures for the AI system are defined and documented, with criteria for their use.
    controls: [AI-04, CHG-03]
  - code: A.6.2.5
    section: A.6 AI system life cycle
    title: AI system deployment
    description: A deployment plan is documented and requirements are confirmed as met before the AI system is deployed.
    controls: [CHG-05, CHG-04, AI-02]
  - code: A.6.2.6
    section: A.6 AI system life cycle
    title: AI system operation and monitoring
    description: Elements needed for ongoing operation are defined, including monitoring, repairs, updates and support.
    controls: [AI-04, VUL-04]
  - code: A.6.2.7
    section: A.6 AI system life cycle
    title: AI system technical documentation
    description: Technical documentation needed by relevant interested parties, such as users, partners and authorities, is determined and provided in suitable form.
    controls: [AI-07]
  - code: A.6.2.8
    section: A.6 AI system life cycle
    title: AI system recording of event logs
    description: The organization decides at which life cycle phases event logging is enabled, at minimum while the AI system is in use.
    controls: [LOG-01, LOG-03]
  - code: A.7.2
    section: A.7 Data for AI systems
    title: Data for development and enhancement of AI systems
    description: Data management processes for developing and enhancing AI systems are defined, documented and implemented.
    controls: [AI-06]
  - code: A.7.3
    section: A.7 Data for AI systems
    title: Acquisition of data
    description: Details about how data used in AI systems is acquired and selected are determined and documented.
    controls: [AI-06, VEN-03]
  - code: A.7.4
    section: A.7 Data for AI systems
    title: Quality of data for AI systems
    description: Data quality requirements are defined, and data used to develop and operate the AI system is checked against them.
    controls: [AI-06]
  - code: A.7.5
    section: A.7 Data for AI systems
    title: Data provenance
    description: A process records the provenance of data used in AI systems across the data and system life cycles.
    controls: [AI-06, DAT-07]
  - code: A.7.6
    section: A.7 Data for AI systems
    title: Data preparation
    description: Criteria for selecting data preparation methods and the methods themselves are defined and documented.
    controls: [AI-06]
  - code: A.8.2
    section: A.8 Information for interested parties of AI systems
    title: System documentation and information for users
    description: Users of the AI system are given the information they need to use it appropriately.
    controls: [AI-07]
  - code: A.8.3
    section: A.8 Information for interested parties of AI systems
    title: External reporting
    description: Interested parties have a way to report adverse impacts of the AI system.
    controls: [AI-08]
  - code: A.8.4
    section: A.8 Information for interested parties of AI systems
    title: Communication of incidents
    description: A plan is defined for communicating AI system incidents to users and other relevant parties.
    controls: [AI-08, IR-01, IR-03]
  - code: A.8.5
    section: A.8 Information for interested parties of AI systems
    title: Information for interested parties
    description: The organization determines and documents its obligations to report information about the AI system to interested parties, and meets them.
    controls: [AI-07, GOV-08]
  - code: A.9.2
    section: A.9 Use of AI systems
    title: Processes for responsible use of AI systems
    description: Processes for the responsible use of AI systems are defined and documented.
    controls: [AI-03, AI-05]
  - code: A.9.3
    section: A.9 Use of AI systems
    title: Objectives for responsible use of AI systems
    description: Objectives guiding the responsible use of AI systems are identified and documented.
    controls: [AI-03]
  - code: A.9.4
    section: A.9 Use of AI systems
    title: Intended use of the AI system
    description: AI systems are used according to their intended purpose and accompanying documentation.
    controls: [AI-03, AI-01, AI-04]
  - code: A.10.2
    section: A.10 Third-party and customer relationships
    title: Allocating responsibilities
    description: Responsibilities across the AI system life cycle are allocated between the organization, its partners, suppliers, customers and other third parties.
    controls: [VEN-03, GOV-02]
  - code: A.10.3
    section: A.10 Third-party and customer relationships
    title: Suppliers
    description: A process ensures that services, products or materials from suppliers align with the organization's approach to responsible AI development and use.
    controls: [VEN-02, VEN-01, VEN-03]
  - code: A.10.4
    section: A.10 Third-party and customer relationships
    title: Customers
    description: The organization's approach to responsible AI development and use takes into account customer expectations and needs.
    controls: [AI-07, VEN-03]
