id: vendor-security-v1
title: Vendor Security Questionnaire
description: Twenty questions covering the security practices we expect from vendors that access our data.
questions:
  - {id: certifications, section: Assurance, type: choice, options: [SOC 2 Type II, ISO 27001, Both, None], question: "Which independent security attestations do you hold?"}
  - {id: report_date, section: Assurance, type: text, question: "When does the period of your most recent audit report end? (YYYY-MM-DD)"}
  - {id: subprocessors, section: Assurance, type: text, question: "Which subprocessors will process our data?"}
  - {id: mfa, section: Access control, type: yes_no, question: "Is multi-factor authentication enforced for all employee access to production systems and customer data?"}
  - {id: sso, section: Access control, type: yes_no, question: "Do you support SAML or OIDC single sign-on for customer users?"}
  - {id: access_reviews, section: Access control, type: yes_no, question: "Do you review employee access to customer data at least quarterly?"}
  - {id: offboarding, section: Access control, type: yes_no, question: "Is access removed within one business day when an employee leaves?"}
  - {id: encryption_rest, section: Data protection, type: yes_no, question: "Is customer data encrypted at rest (AES-256 or equivalent)?"}
  - {id: encryption_transit, section: Data protection, type: yes_no, question: "Is customer data encrypted in transit with TLS 1.2 or higher?"}
  - {id: data_location, section: Data protection, type: text, question: "In which countries is our data stored and processed?"}
  - {id: retention, section: Data protection, type: yes_no, question: "Do you delete customer data within 30 days of contract termination?"}
  - {id: dpa, section: Data protection, type: yes_no, question: "Will you sign our data processing agreement (DPA)?"}
  - {id: pentest, section: Security operations, type: yes_no, question: "Do you perform an independent penetration test at least annually?"}
  - {id: vuln_sla, section: Security operations, type: yes_no, question: "Are critical vulnerabilities remediated within 30 days?"}
  - {id: logging, section: Security operations, type: yes_no, question: "Are security-relevant events logged and monitored with alerting?"}
  - {id: incident_notice, section: Incident response, type: yes_no, question: "Will you notify us of a security incident affecting our data within 72 hours?"}
  - {id: ir_plan, section: Incident response, type: yes_no, question: "Do you maintain and annually test an incident response plan?"}
  - {id: bcp, section: Resilience, type: yes_no, question: "Do you maintain and annually test business continuity and disaster recovery plans?"}
  - {id: training, section: People, type: yes_no, question: "Do all employees complete security awareness training at least annually?"}
  - {id: ai_use, section: AI, type: text, question: "Do you use our data to train AI models? If yes, explain the controls and opt-out."}
