# Render blueprint for the Trustline backend (demo mode). The React app is
# served by Netlify (netlify.toml), which proxies /api, /auth and /agent here.
#
# One web service runs the API and the worker in one process (`trustline all`)
# and seeds the demo data on boot (idempotent). Files are stored in Postgres,
# so no disk or object storage is needed.
#
# Free plans: the service sleeps after 15 minutes idle (the scheduler pauses
# with it) and the free database expires after 30 days. For an always-on demo
# switch the web service to `starter` and the database to `basic-256mb`.
services:
  - type: web
    name: trustline-api
    runtime: docker
    plan: free
    branch: phase-3
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: sh -c "/app/trustline seed && exec /app/trustline all"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TRUSTLINE_ENV
        value: prod
      - key: PORT
        value: "8080"
      - key: HTTP_ADDR
        value: ":8080"
      - key: BASE_URL
        sync: false # the public Netlify URL, e.g. https://trustline-demo.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: trustline-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trustline-kv
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_OAUTH_MODE
        value: "off"
      - key: MAIL_MODE
        value: memory
      - key: BLOB_MODE
        value: postgres
      - key: AI_MODE
        value: fake
      - key: SCHEDULER_INTERVAL
        value: 5m
      - key: WEB_DIST
        value: /app/web
      - key: LOG_FORMAT
        value: json

  - type: keyvalue
    name: trustline-kv
    plan: free
    ipAllowList: [] # internal connections only
    maxmemoryPolicy: allkeys-lru

databases:
  - name: trustline-db
    plan: free
    databaseName: trustline
    user: trustline
